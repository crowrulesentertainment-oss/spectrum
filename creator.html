<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Spectrum Creator Portal</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="assets/supabase.js"></script><style>@import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;800&family=Orbitron:wght@600;800&display=swap');*{box-sizing:border-box}body{margin:0;background:#030309;color:#fff;font:14px Montserrat,Arial}.wrap{max-width:1050px;margin:auto;padding:28px}.ey{color:#32e6ff;font:800 11px Orbitron;letter-spacing:3px}h1{font:800 38px Orbitron;margin:8px 0}.muted{color:#a5a7b7}.card{background:#0b0b14;border:1px solid #29293a;border-radius:18px;padding:20px;margin-top:16px}input,textarea{width:100%;margin:7px 0 14px;padding:12px;border-radius:10px;border:1px solid #333;background:#07070d;color:#fff}button{padding:11px 16px;border:0;border-radius:10px;background:linear-gradient(90deg,#32e6ff,#9b5cff);font-weight:800}.profile{display:grid;grid-template-columns:1fr 1fr;gap:14px}.nom{padding:14px 0;border-bottom:1px solid #222}@media(max-width:700px){.profile{grid-template-columns:1fr}}</style></head><body><div class="wrap"><a href="index.html" style="color:#32e6ff">← Spectrum Awards</a><div class="ey">SPECTRUM AWARDS • CREATORS</div><h1>CREATOR PORTAL</h1><p class="muted">Build your Spectrum creator identity and see your official nominations.</p><div id="notice" class="card">Checking membership…</div><main id="app" hidden><div class="card"><h2>Your Creator Profile</h2><div class="profile"><div><label>Display name</label><input id="name"></div><div><label>Public slug</label><input id="slug" placeholder="your-name"></div></div><label>Bio</label><textarea id="bio" rows="5" placeholder="Tell the Spectrum community about your work."></textarea><label>Avatar URL</label><input id="avatar" placeholder="https://…"><button id="save">SAVE PROFILE</button><span id="saved" class="muted"></span></div><div class="card"><h2>Your Nominations</h2><div id="noms">Loading…</div></div></main></div><script>
let db,user;
const notice=document.getElementById("notice"),app=document.getElementById("app");
const esc=s=>String(s??"").replace(/[&<>"']/g,x=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[x]));
async function init(){const m=await CrowRulesMembership.getCrowRulesMember();db=m.client;user=m.user;if(!user){notice.innerHTML="Sign in to use the Creator Portal. <a href='membership.html' style='color:#32e6ff'>Membership</a>";return}app.hidden=false;notice.textContent="Signed in as "+(m.profile?.display_name||user.email);const p=await db.from("spectrum_creator_profiles").select("*").eq("user_id",user.id).maybeSingle();if(p.data){name.value=p.data.display_name||"";slug.value=p.data.public_slug||"";bio.value=p.data.bio||"";avatar.value=p.data.avatar_url||""}else{name.value=m.profile?.display_name||"";slug.value=(m.profile?.username||"").toLowerCase().replace(/[^a-z0-9-]/g,"-")}loadNoms()}
async function save(){saved.textContent="Saving…";const row={user_id:user.id,display_name:name.value.trim(),public_slug:slug.value.trim().toLowerCase(),bio:bio.value.trim(),avatar_url:avatar.value.trim()};const r=await db.from("spectrum_creator_profiles").upsert(row,{onConflict:"user_id"});saved.textContent=r.error?r.error.message:" Profile saved."}
async function loadNoms(){const r=await db.from("spectrum_nominees").select("id,name,description,status,created_at").eq("creator_user_id",user.id).order("created_at",{ascending:false});noms.innerHTML=r.error?esc(r.error.message):(r.data?.map(x=>'<div class="nom"><b>'+esc(x.name)+'</b><div class="muted">'+esc(x.status)+'</div><div>'+esc(x.description||"")+'</div></div>').join("")||"No official nominations linked to this creator yet.")}
save.onclick=save;init().catch(e=>notice.textContent=e.message);
</script></body></html>
