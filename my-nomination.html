<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Spectrum Awards | Nomination Detail</title><link rel="stylesheet" href="css/spectrum.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="https://crowrulesentertainment-oss.github.io/crowrulesentertainment/js/crowrules-sitewide.js?v=3" defer></script><script src="https://crowrulesentertainment-oss.github.io/crowrulesentertainment/js/crowrules-universal-member.js?v=2" defer></script><script src="js/spectrum.js"></script></head><body><header class="topbar"><nav class="nav"><a class="brand" href="home.html">SPECTRUM<span>AWARDS</span></a><button class="menu">☰</button><div id="global-nav" class="navlinks"></div><div id="member-status"></div></nav></header><main class="wrap"><section class="section"><a class="btn" href="my-nominations.html">← My Nominations</a><div id="detail" style="margin-top:24px"><div class="notice">Loading nomination…</div></div></section></main><footer class="footer"><div class="wrap">Spectrum Awards • One Account. One Universe.</div></footer><script>
document.addEventListener("DOMContentLoaded",async()=>{await initSpectrum();const box=document.getElementById("detail"),user=await requireAuth();if(!user)return;const id=new URLSearchParams(location.search).get("id");if(!id){box.innerHTML='<div class="notice error">No nomination was specified.</div>';return}
const r=await sb.from("spectrum_submissions").select("id,title,description,submission_type,status,submitter_note,created_at,updated_at,reviewed_at,category_id,subcategory_id").eq("id",id).eq("user_id",user.id).maybeSingle();if(r.error){box.innerHTML='<div class="notice error">'+esc(r.error.message)+'</div>';return}const n=r.data;if(!n){box.innerHTML='<div class="notice">This nomination could not be found in your account.</div>';return}
const [cr,sr,rr]=await Promise.all([n.category_id?sb.from("spectrum_categories").select("id,name").eq("id",n.category_id).maybeSingle():Promise.resolve({data:null}),n.subcategory_id?sb.from("spectrum_subcategories").select("id,name").eq("id",n.subcategory_id).maybeSingle():Promise.resolve({data:null}),sb.from("spectrum_submission_reviews").select("id,from_status,to_status,note,created_at").eq("submission_id",id).order("created_at",{ascending:false})]);
const cat=cr.data?.name||"Category";const sub=sr.data?.name||"";const label=s=>String(s||"").replaceAll("_"," ").toUpperCase();const fmt=d=>d?new Date(d).toLocaleString():"—";
let history=rr.error?'<div class="notice">Review history is not currently available.</div>':(rr.data||[]).length?(rr.data||[]).map(x=>'<div class="item"><div><b>'+esc(label(x.to_status))+'</b><br><small>'+esc(fmt(x.created_at))+'</small>'+(x.from_status?'<br><small>From: '+esc(label(x.from_status))+'</small>':"")+(x.note?'<p>'+esc(x.note)+'</p>':"")+'</div></div>').join(""):'<div class="notice">No review decisions have been recorded yet.</div>';
box.innerHTML='<div class="eyebrow">MY NOMINATION</div><h1>'+esc(n.title)+'</h1><p class="lead">'+esc(cat)+(sub?" • "+esc(sub):"")+'</p><div class="grid two"><div class="card"><div class="kicker">STATUS</div><h3><span class="chip">'+esc(label(n.status))+'</span></h3><p><b>Submission type:</b> '+esc(n.submission_type)+'</p><p><b>Submitted:</b> '+esc(fmt(n.created_at))+'<br><b>Updated:</b> '+esc(fmt(n.updated_at))+'<br><b>Reviewed:</b> '+esc(fmt(n.reviewed_at))+'</p></div><div class="card"><div class="kicker">CATEGORY</div><h3>'+esc(cat)+'</h3>'+(sub?'<p><b>Subcategory:</b> '+esc(sub)+'</p>':"")+'<p>'+esc(n.description||"No description provided.")+'</p></div></div>'+(n.submitter_note?'<div class="card" style="margin-top:18px"><div class="kicker">YOUR SUBMISSION NOTE</div><p>'+esc(n.submitter_note)+'</p></div>':"")+'<div class="section" style="padding-bottom:0"><div class="eyebrow">REVIEW HISTORY</div><h2>Submission Timeline</h2><div class="list">'+history+'</div></div>'+(n.status==="official_nominee"?'<div class="actions" style="justify-content:flex-start;margin-top:24px"><a class="btn primary" href="nominees.html">Open Official Nominees →</a></div>':"");
});</script></body></html>
