<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Spectrum Awards | Finalists</title><link rel="stylesheet" href="css/spectrum.css"></head><body><header><div class="brand">SPECTRUM AWARDS</div><nav id="global-nav"></nav><div id="member-status"></div></header><main><section class="hero"><div class="kicker">THE FINALIST STAGE</div><h1>Finalists</h1><p>Official finalists selected from the completed Pre-Voting round appear here. Live Voting uses only finalists marked Official by Awards HQ.</p></section><section><div id="message"></div><div id="finalist-list"><div class="notice">Loading finalists…</div></div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/spectrum.js"></script><script>(async()=>{await initSpectrum();const box=document.getElementById("finalist-list");const c=await loadVotingConfig("live_voting");if(!c){box.innerHTML='<div class="notice">Live Voting is not configured yet.</div>';return}const pre=await sb.from("spectrum_voting_config").select("id").eq("award_id",c.award_id).eq("round_type","pre_voting").maybeSingle();if(pre.error||!pre.data){box.innerHTML='<div class="notice">Pre-Voting is not configured yet.</div>';return}const r=await sb.from("spectrum_finalists").select("id,category_id,nominee_id,rank,status,spectrum_categories(name),spectrum_nominees(name,description)").eq("voting_config_id",pre.data.id).eq("status","official").order("category_id").order("rank");if(r.error){box.innerHTML='<div class="notice error">'+esc(r.error.message)+'</div>';return}if(!r.data?.length){box.innerHTML='<div class="notice">No official finalists have been published yet.</div>';return}box.innerHTML=r.data.map(f=>'<article class="card"><div class="kicker">'+esc(f.spectrum_categories?.name||"Category")+'</div><h2>'+esc(f.spectrum_nominees?.name||"Nominee")+'</h2><p>'+(f.spectrum_nominees?.description?esc(f.spectrum_nominees.description):"")+'</p><span class="chip">FINALIST • RANK '+esc(f.rank||"—")+'</span></article>').join("")})();</script></body></html>
