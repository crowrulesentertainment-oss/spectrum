<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Spectrum Awards | Official Nominees</title><link rel="stylesheet" href="css/spectrum.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="https://crowrulesentertainment-oss.github.io/crowrulesentertainment/js/crowrules-sitewide.js?v=3" defer></script><script src="https://crowrulesentertainment-oss.github.io/crowrulesentertainment/js/crowrules-universal-member.js?v=2" defer></script><script src="js/spectrum.js"></script></head><body><header class="topbar"><nav class="nav"><a class="brand" href="home.html">SPECTRUM<span>AWARDS</span></a><button class="menu">☰</button><div id="global-nav" class="navlinks"></div><a class="btn" href="admin.html">Awards HQ</a><div id="member-status"></div></nav></header><main class="wrap"><section class="section"><div class="eyebrow">THE OFFICIAL FIELD</div><h1>Official Nominees</h1><p class="lead">Browse nominees officially published by Spectrum Awards HQ.</p><div id="nominee-list" class="list"><div class="notice">Loading official nominees…</div></div></section></main><footer class="footer"><div class="wrap">Spectrum Awards • Official Nominees</div></footer><script>document.addEventListener("DOMContentLoaded",async()=>{await initSpectrum();const box=document.getElementById("nominee-list");if(!sb){box.innerHTML='<div class="notice error">Spectrum is not connected to Supabase.</div>';return}const r=await sb.from("spectrum_nominees").select("id,name,description,category_id,subcategory_id,status").eq("status","official").order("name");if(r.error){box.innerHTML='<div class="notice error">'+esc(r.error.message)+'</div>';return}const rows=r.data||[];if(!rows.length){box.innerHTML='<div class="notice">No official nominees have been published yet.</div>';return}const cats=[...new Set(rows.map(x=>x.category_id))],subs=[...new Set(rows.map(x=>x.subcategory_id).filter(Boolean))];const [cr,sr]=await Promise.all([sb.from("spectrum_categories").select("id,name").in("id",cats),subs.length?sb.from("spectrum_subcategories").select("id,name").in("id",subs):Promise.resolve({data:[]})]);const cm=Object.fromEntries((cr.data||[]).map(x=>[x.id,x.name])),sm=Object.fromEntries((sr.data||[]).map(x=>[x.id,x.name]));box.innerHTML='<div class="filters"><input id="nominee-search" type="search" placeholder="Search nominees…"><select id="nc"><option value="">All Categories</option>'+Object.entries(cm).sort((a,b)=>a[1].localeCompare(b[1])).map(([id,n])=>'<option value="'+esc(id)+'">'+esc(n)+'</option>').join("")+'</select><select id="ns"><option value="">All Subcategories</option>'+Object.entries(sm).sort((a,b)=>a[1].localeCompare(b[1])).map(([id,n])=>'<option value="'+esc(id)+'">'+esc(n)+'</option>').join("")+'</select></div><div id="nominee-count" class="kicker"></div><div id="nr"></div>';const draw=()=>{const q=(document.getElementById("nominee-search").value||"").trim().toLowerCase(),cf=document.getElementById("nc").value,sf=document.getElementById("ns").value;const out=rows.filter(x=>(!cf||x.category_id===cf)&&(!sf||x.subcategory_id===sf)&&(!q||((x.name||"")+" "+(cm[x.category_id]||"")+" "+(sm[x.subcategory_id]||"")+" "+(x.description||"")).toLowerCase().includes(q)));document.getElementById("nominee-count").textContent=out.length+" nominee"+(out.length===1?"":"s");document.getElementById("nr").innerHTML=out.map(x=>'<a class="item" href="nominee.html?id='+encodeURIComponent(x.id)+'" style="display:flex;text-decoration:none;color:inherit"><div><b>'+esc(x.name)+'</b><br><small>'+esc(cm[x.category_id]||"Category")+(sm[x.subcategory_id]?" • "+esc(sm[x.subcategory_id]):"")+'</small><p>'+esc(x.description||"")+'</p><small>View nominee details →</small></div><span class="chip">OFFICIAL</span></a>').join("")||'<div class="notice">No nominees match those filters.</div>'};document.getElementById("nominee-search").addEventListener("input",draw);document.getElementById("nc").addEventListener("change",draw);document.getElementById("ns").addEventListener("change",draw);draw()});</script></body></html>
