<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Spectrum Nominee Management</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="assets/supabase.js"></script><style>body{margin:0;background:#030309;color:#fff;font:14px Montserrat,Arial}.wrap{max-width:1200px;margin:auto;padding:28px}.ey{color:#32e6ff;font:700 11px Orbitron;letter-spacing:3px}h1{font:800 38px Orbitron}.card{background:#0b0b14;border:1px solid #29293a;border-radius:18px;padding:18px;margin:16px 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px}.item{border:1px solid #242438;border-radius:14px;padding:15px}.muted{color:#9da0b0}.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}button,input,textarea,select{padding:10px;border-radius:9px;border:1px solid #333;background:#08080e;color:#fff}button{background:#32e6ff;color:#020207;font-weight:800;border:0}.danger{background:#5a1835;color:#fff}.back{color:#32e6ff}img{width:100%;max-height:180px;object-fit:cover;border-radius:10px;margin-top:10px}.pill{display:inline-block;padding:4px 8px;border-radius:99px;background:#17172a;color:#32e6ff}</style></head><body><div class="wrap"><a class="back" href="admin.html">← Admin Command Center</a><div class="ey">CROWRULES • SPECTRUM</div><h1>NOMINEE MANAGEMENT</h1><p class="muted">Manage the official nominee roster before voting.</p><div id="notice">Verifying administrator access…</div><section id="app" hidden><div class="card"><h2>Season</h2><select id="season"></select></div><div class="card"><h2>Add Nominee</h2><div class="grid"><select id="cat"></select><input id="name" placeholder="Nominee name"><input id="type" placeholder="Nominee type"><input id="project" placeholder="Project name"><input id="image" placeholder="Image URL"><textarea id="desc" placeholder="Description"></textarea></div><div class="row"><button id="add">ADD NOMINEE</button></div></div><div class="card"><h2>Official Roster</h2><div id="list">Loading…</div></div></section></div><script>let db;const esc=s=>String(s??"").replace(/[&<>"]/g,x=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[x]));async function init(){const m=await CrowRulesMembership.getCrowRulesMember();db=m.client;if(!m.user){notice.textContent="Sign in required.";return}const a=await db.rpc("crplus_is_admin");if(a.error||!a.data){notice.textContent="Administrator access is required.";return}app.hidden=false;notice.textContent="Administrator access verified.";load()}async function load(){const seasons=await db.from("spectrum_awards").select("id,award_year,title").order("award_year",{ascending:false});season.innerHTML=(seasons.data||[]).map(x=>"<option value=\""+x.id+"\">"+esc(x.award_year)+" — "+esc(x.title)+"</option>").join(""); const [c,n]=await Promise.all([db.from("spectrum_award_categories").select("id,name").eq("is_active",true).order("sort_order"),db.from("spectrum_award_nominees").select("*").eq("award_id",season.value).order("category_id").order("created_at",{ascending:false})]);cat.innerHTML=(c.data||[]).map(x=>'<option value="'+x.id+'">'+esc(x.name)+'</option>').join("");const cats=Object.fromEntries((c.data||[]).map(x=>[x.id,x.name]));list.innerHTML=n.error?esc(n.error.message):(n.data||[]).map(x=>'<div class="item"><span class="pill">'+esc(cats[x.category_id]||"Category")+'</span><h3>'+esc(x.nominee_name)+'</h3><div>'+esc(x.project_name||"")+'</div><p class="muted">'+esc(x.description||"")+'</p>'+(x.image_url?'<img src="'+esc(x.image_url)+'" alt="">':"")+'<div class="row"><button onclick="togglePub('+x.id+','+(!x.is_published)+')">'+(x.is_published?"UNPUBLISH":"PUBLISH")+'</button><button class="danger" onclick="removeNom('+x.id+')">REMOVE</button></div></div>').join("")||"No nominees yet."}async function addNom(){const awardId=season.value;if(!awardId)return alert("Create a Spectrum season first.");if(!name.value.trim())return alert("Nominee name is required.");const r=await db.from("spectrum_award_nominees").insert({award_id:awardId,category_id:Number(cat.value),nominee_name:name.value.trim(),nominee_type:type.value.trim()||"person",project_name:project.value.trim()||null,image_url:image.value.trim()||null,description:desc.value.trim()||null,status:"approved",is_published:true});if(r.error)return alert(r.error.message);name.value=type.value=project.value=image.value=desc.value="";load()}async function togglePub(id,v){const r=await db.from("spectrum_award_nominees").update({is_published:v}).eq("id",id);if(r.error)alert(r.error.message);else load()}async function removeNom(id){if(!confirm("Remove this nominee from the official roster?"))return;const r=await db.from("spectrum_award_nominees").update({status:"rejected",is_published:false}).eq("id",id);if(r.error)alert(r.error.message);else load()}season.onchange=load;add.onclick=addNom;init().catch(e=>notice.textContent=e.message);</script></body></html>
