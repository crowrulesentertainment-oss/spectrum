<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#020205"><title>Spectrum Awards | Archive</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="assets/supabase.js"></script><style>@import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&family=Orbitron:wght@600;800&display=swap');*{box-sizing:border-box}body{margin:0;background:#020205;color:#fff;font-family:Montserrat,Arial}.wrap{width:min(1160px,calc(100% - 32px));margin:auto;padding:45px 0 80px}.ey{font:700 11px Orbitron;letter-spacing:3px;color:#32e6ff}h1{font:800 clamp(42px,7vw,82px) Orbitron;letter-spacing:-4px;margin:12px 0}.lead,.muted{color:#9c9caf;line-height:1.8}.hero{padding:55px 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px}.card{padding:24px;border:1px solid rgba(255,255,255,.11);border-radius:20px;background:rgba(10,10,18,.75)}.card h2{font:800 23px Orbitron}.pill{display:inline-block;padding:6px 9px;border-radius:99px;background:rgba(50,230,255,.08);color:#32e6ff;font:700 10px Orbitron;letter-spacing:1px}.btn{display:inline-block;margin-top:16px;padding:11px 14px;border-radius:10px;background:linear-gradient(100deg,#32e6ff,#9b5cff);color:#fff;text-decoration:none;font-weight:800;font-size:11px}.empty{padding:28px;border:1px dashed #303044;border-radius:18px;color:#9c9caf}a.back{color:#32e6ff;text-decoration:none;font-size:12px}</style></head><body><div class="wrap"><a class="back" href="index.html">← Spectrum Awards</a><section class="hero"><div class="ey">THE SPECTRUM RECORD</div><h1>ARCHIVE</h1><p class="lead">A permanent home for Spectrum Awards editions, winners, and the history of the CrowRules awards universe.</p></section><div id="status" class="muted">Loading archive…</div><div id="grid" class="grid"></div><div id="legacy"></div></div><script>(async()=>{const status=document.getElementById("status"),grid=document.getElementById("grid"),esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));try{const db=await window.CrowRulesMembership.loadCrowRulesSupabase();const [a,h]=await Promise.all([db.from("spectrum_award_archive").select("id,award_year,edition_name,description,winner_count,archive_url,is_published").eq("is_published",true).order("award_year",{ascending:false}),db.from("spectrum_award_hall_of_fame").select("id,honor_name,description,honoree_name,induction_year,image_url").eq("is_published",true).order("induction_year",{ascending:false})]);if(a.error)throw a.error;const rows=a.data||[];status.textContent=rows.length+" published archive edition(s).";grid.innerHTML=rows.length?rows.map(x=>'<article class="card"><span class="pill">'+esc(x.award_year)+'</span><h2>'+esc(x.edition_name||("Spectrum Awards "+x.award_year))+'</h2><p class="muted">'+esc(x.description||"")+'</p><p class="muted">'+esc(x.winner_count??0)+' certified winners</p><a class="btn" href="'+(x.archive_url?esc(x.archive_url):'season.html?year='+encodeURIComponent(x.award_year))+'">VIEW EDITION</a></article>').join(""):'<div class="empty">The Spectrum archive is ready. Historical editions will appear here as they are certified and published.</div>';if(!h.error&&(h.data||[]).length){document.getElementById("legacy").innerHTML='<section style="margin-top:70px"><div class="ey">SPECTRUM LEGACY</div><h2 style="font:800 34px Orbitron">HALL OF FAME</h2><div class="grid" style="margin-top:20px">'+h.data.map(x=>'<article class="card"><span class="pill">'+esc(x.induction_year)+'</span><h2>'+esc(x.honoree_name)+'</h2><p class="muted">'+esc(x.honor_name)+'</p><p class="muted">'+esc(x.description||"")+'</p></article>').join("")+'</div></section>'}}catch(e){status.textContent="Archive data is temporarily unavailable.";console.error(e)}})();</script></body></html>
