<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Spectrum Awards | Season Manager</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="assets/supabase.js"></script><style>body{margin:0;background:#030309;color:#fff;font:14px Montserrat,Arial}.wrap{max-width:1100px;margin:auto;padding:30px}.ey{color:#32e6ff;font:700 11px Orbitron;letter-spacing:3px}h1{font:800 40px Orbitron}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:15px}.card{background:#0b0b14;border:1px solid #29293a;border-radius:18px;padding:20px;margin-top:16px}.muted{color:#9da0b0}.row{display:flex;gap:10px;flex-wrap:wrap}.field{display:flex;flex-direction:column;gap:6px;flex:1;min-width:180px}input,select,textarea{padding:11px;border-radius:9px;border:1px solid #333;background:#08080e;color:#fff}button{padding:11px 14px;border:0;border-radius:9px;background:#32e6ff;color:#020207;font-weight:800;cursor:pointer}.danger{background:#5a1835;color:#fff}.back{color:#32e6ff}.season{padding:14px 0;border-bottom:1px solid #242431}</style></head><body><div class="wrap"><a class="back" href="index.html">← Spectrum Awards</a><div class="ey">CROWRULES • SPECTRUM</div><h1>SEASON MANAGER</h1><p class="muted">Create and manage a Spectrum Awards edition, then configure its voting window.</p><div id="notice">Verifying administrator access…</div><section id="app" hidden><div class="card"><h2>Create Awards Edition</h2><div class="row"><label class="field">Year<input id="year" type="number" min="2026" value="2027"></label><label class="field">Title<input id="title" value="Spectrum Awards"></label><label class="field">Ceremony<input id="ceremony" type="datetime-local"></label></div><label class="field" style="margin-top:10px">Description<textarea id="desc" rows="3"></textarea></label><p><button id="create">CREATE SEASON</button></p></div><div class="card"><h2>Seasons</h2><div id="seasons">Loading…</div></div><div class="card"><h2>Voting Configuration</h2><div class="row"><label class="field">Season<select id="award"></select></label><label class="field">Eligibility<select id="elig"><option value="authenticated">Authenticated members</option><option value="all_members">All CrowRules members</option></select></label><label class="field">Max votes/category<input id="max" type="number" min="1" value="1"></label></div><div class="row" style="margin-top:10px"><label class="field">Opens<input id="opens" type="datetime-local"></label><label class="field">Closes<input id="closes" type="datetime-local"></label></div><p><button id="saveCfg">CREATE VOTING CONFIG</button></p><div id="configs"></div></div></section></div><script>let db;const $=id=>document.getElementById(id),esc=s=>String(s??"").replace(/[&<>"']/g,x=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[x]));const iso=id=>{const v=$(id).value;return v?new Date(v).toISOString():null};async function init(){const m=await CrowRulesMembership.getCrowRulesMember();db=m.client;if(!m.user){$("notice").textContent="Sign in required.";return}const a=await db.rpc("crplus_is_admin");if(a.error||!a.data){$("notice").textContent="Administrator access is required.";return}$("notice").textContent="Administrator access verified.";$("app").hidden=false;await load()}async function load(){const s=await db.from("spectrum_awards").select("*").order("award_year",{ascending:false});$("seasons").innerHTML=s.error?esc(s.error.message):(s.data?.map(x=>'<div class="season"><b>'+esc(x.award_year)+" — "+esc(x.title)+'</b><div class="muted">'+esc(x.status)+(x.ceremony_at?" · Ceremony "+new Date(x.ceremony_at).toLocaleString():"")+'</div></div>').join("")||"No seasons yet.");$("award").innerHTML=(s.data||[]).map(x=>'<option value="'+x.id+'">'+esc(x.award_year)+" — "+esc(x.title)+"</option>").join("")||"<option value=''>Create a season first</option>";const c=await db.from("spectrum_voting_config").select("*").order("created_at",{ascending:false});$("configs").innerHTML=c.error?esc(c.error.message):(c.data?.map(x=>'<div class="season"><b>'+esc(x.voting_status)+'</b> · '+esc(x.eligibility)+' · max '+esc(x.max_votes_per_category)+'<div class="muted">'+(x.opens_at?"Opens "+new Date(x.opens_at).toLocaleString():"No opening time")+" · "+(x.closes_at?"Closes "+new Date(x.closes_at).toLocaleString():"No closing time")+"</div></div>").join("")||"No voting configurations yet.")}async function createSeason(){const r=await db.from("spectrum_awards").insert({award_year:Number($("year").value),title:$("title").value.trim()||"Spectrum Awards",status:"planned",ceremony_at:iso("ceremony"),description:$("desc").value.trim()||null});if(r.error)alert(r.error.message);else{alert("Awards season created.");load()}}async function saveConfig(){const award=$("award").value;if(!award){alert("Create a season first.");return}const r=await db.from("spectrum_voting_config").insert({award_id:award,voting_status:"draft",eligibility:$("elig").value,max_votes_per_category:Math.max(1,Number($("max").value)||1),opens_at:iso("opens"),closes_at:iso("closes"),public_results_enabled:true});if(r.error)alert(r.error.message);else{alert("Voting configuration created.");load()}}$("create").onclick=createSeason;$("saveCfg").onclick=saveConfig;init().catch(e=>$("notice").textContent=e.message);</script></body></html>
