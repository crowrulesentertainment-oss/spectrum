<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#000"><title>Spectrum Awards | Graphics</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="assets/supabase.js"></script><style>@import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@500;700;800&family=Orbitron:wght@700;800&display=swap');*{box-sizing:border-box}body{margin:0;background:transparent;color:#fff;font-family:Montserrat;overflow:hidden}.frame{min-height:100vh;display:flex;align-items:flex-end;padding:5vw}.graphic{width:min(1100px,100%);padding:28px 34px;border-left:7px solid #32e6ff;background:linear-gradient(90deg,rgba(4,4,12,.96),rgba(8,5,20,.84),rgba(8,5,20,0));box-shadow:0 15px 60px rgba(0,0,0,.45)}.ey{font:800 11px Orbitron;letter-spacing:4px;color:#32e6ff}.title{font:800 clamp(28px,5vw,64px) Orbitron;margin:8px 0}.sub{font-size:clamp(15px,2vw,25px);color:#d7d7e2}.winner{border-color:#ffd66b}.winner .ey{color:#ffd66b}.winner .title{color:#ffd66b}.top{position:fixed;top:20px;left:20px;font:800 10px Orbitron;letter-spacing:3px;color:#777;display:none}.err{position:fixed;inset:0;display:grid;place-items:center;color:#ff5c88;font-weight:800}@media(max-width:600px){.graphic{padding:20px 22px;border-left-width:5px}}</style></head><body><div id="error" class="err"></div><main class="frame"><section id="graphic" class="graphic"><div id="ey" class="ey">SPECTRUM AWARDS</div><div id="title" class="title">STANDBY</div><div id="sub" class="sub">Waiting for production cue</div></section></main><script>(async()=>{const $=id=>document.getElementById(id);let db,season,ceremonyId,productionState="planning";async function init(){const m=await CrowRulesMembership.getCrowRulesMember();db=m.client;if(!m.user)throw Error("Sign in required.");const a=await db.rpc("crplus_is_admin");if(a.error||!a.data)throw Error("Administrator access is required.");const q=await db.from("spectrum_awards").select("id,award_year,title").order("award_year",{ascending:false}).limit(1);if(q.error||!q.data?.length)throw Error(q.error?.message||"No Spectrum season exists.");season=q.data[0];const cq=await db.from("spectrum_ceremonies").select("id,title,starts_at,ends_at,production_state").eq("award_id",season.id).order("starts_at",{ascending:false}).limit(1);if(cq.error)throw cq.error;if(!cq.data?.length)throw Error("No ceremony is configured for this season.");ceremonyId=cq.data[0].id;productionState=cq.data[0].production_state||"planning";await render();db.channel("spectrum-graphics").on("postgres_changes",{event:"*",schema:"public",table:"spectrum_ceremony_cues"},render).on("postgres_changes",{event:"*",schema:"public",table:"spectrum_ceremonies",filter:"id=eq."+ceremonyId},render).subscribe()}async function render(){const st=await db.from("spectrum_ceremonies").select("production_state").eq("id",ceremonyId).single();if(!st.error)productionState=st.data?.production_state||productionState;const q=await db.from("spectrum_ceremony_cues").select("id,segment_id,cue_type,title,instruction,status,sort_order").eq("ceremony_id",ceremonyId).order("sort_order",{ascending:true});if(q.error)throw q.error;const fired=(q.data||[]).filter(x=>x.status==="fired");const x=fired[fired.length-1];if(!x){$("title").textContent=productionState.toUpperCase();$("sub").textContent="Production state";return}const win=x.cue_type==="winner_reveal";$("graphic").className="graphic"+(win?" winner":"");$("ey").textContent=win?"SPECTRUM • WINNER":"SPECTRUM AWARDS • "+season.award_year;$("title").textContent=x.title||"LIVE";$("sub").textContent=x.instruction||x.cue_type||"LIVE"}try{await init()}catch(e){$("error").textContent=e.message}})();</script></body></html>
