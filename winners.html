<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Spectrum Awards | Winners</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="assets/supabase.js"></script><style>@import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;800&family=Orbitron:wght@600;800&display=swap');*{box-sizing:border-box}body{margin:0;background:#030309;color:#fff;font:14px Montserrat,Arial}.wrap{max-width:1100px;margin:auto;padding:30px}.ey{color:#32e6ff;font:800 11px Orbitron;letter-spacing:3px}h1{font:800 42px Orbitron;margin:8px 0}.muted{color:#9da0b0}.hero{padding:50px 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px}.card{background:#0b0b14;border:1px solid #29293a;border-radius:18px;padding:20px}.winner{border-color:#d8b65a;background:linear-gradient(145deg,#0d0b14,#17101c)}.badge{display:inline-block;color:#d8b65a;font:800 10px Orbitron;letter-spacing:2px}.back{color:#32e6ff}</style></head><body><div class="wrap"><a class="back" href="index.html">← Spectrum Awards</a><section class="hero"><div class="ey">THE SPECTRUM AWARDS</div><h1>WINNERS</h1><p class="muted">Celebrating creators, performers and projects across the full spectrum of entertainment.</p></section><div id="status" class="muted">Loading certified results…</div><div id="grid" class="grid"></div></div><script>const grid=document.getElementById("grid"),status=document.getElementById("status"),esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));async function init(){const m=await CrowRulesMembership.getCrowRulesMember();const {data,error}=await m.client.from("spectrum_award_results").select("nominee_name,project_name,description,image_url,result_status,announced_at").eq("result_status","winner").order("announced_at",{ascending:false});if(error){status.textContent=error.message;return}status.textContent=data?.length?"Certified Spectrum winners":"No winners have been announced yet.";grid.innerHTML=(data||[]).map(x=>'<article class="card winner"><span class="badge">SPECTRUM WINNER</span><h2>'+esc(x.nominee_name)+'</h2><h3>'+esc(x.project_name||"")+'</h3><p>'+esc(x.description||"")+'</p>'+(x.announced_at?'<small class="muted">'+new Date(x.announced_at).toLocaleDateString()+'</small>':"")+'</article>').join("")}init().catch(e=>status.textContent=e.message)</script></body></html>
