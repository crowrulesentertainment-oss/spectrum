<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Spectrum Awards | Submission Review</title><link rel="stylesheet" href="css/spectrum.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="https://crowrulesentertainment-oss.github.io/crowrulesentertainment/js/crowrules-sitewide.js?v=3" defer></script><script src="https://crowrulesentertainment-oss.github.io/crowrulesentertainment/js/crowrules-universal-member.js?v=2" defer></script><script src="js/spectrum.js"></script></head><body><header class="topbar"><nav class="nav"><a class="brand" href="home.html">SPECTRUM<span>AWARDS</span></a><div id="global-nav" class="navlinks"></div><div id="member-status"></div></nav></header><main class="wrap"><section class="section"><div class="eyebrow">AWARDS HQ</div><h1>Submission Review</h1><p class="lead">Review the complete nomination record before moving it through the Spectrum Awards workflow.</p><div id="message"></div><div id="review">Loading…</div><a class="btn" href="admin.html">← Back to Awards HQ</a></section></main><footer class="footer"><div class="wrap">Spectrum Awards • Submission Review</div></footer><script>
const escR=v=>String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
const id=new URLSearchParams(location.search).get("id");
async function loadReview(){await initSpectrum();const u=await requireAuth();if(!u)return;const a=await sb.rpc("spectrum_hq_is_admin");if(a.error||a.data!==true){showMsg("Administrator authorization is required.","error");return}if(!id){showMsg("No submission was selected.","error");return}
const r=await sb.from("spectrum_submissions").select("id,title,description,submission_type,status,submitter_note,created_at,updated_at,reviewed_at,user_id,category_id,subcategory_id").eq("id",id).maybeSingle();if(r.error||!r.data){showMsg(r.error?.message||"Submission not found.","error");return}const s=r.data;
const [cat,sub,revs]=await Promise.all([sb.from("spectrum_categories").select("name").eq("id",s.category_id).maybeSingle(),s.subcategory_id?sb.from("spectrum_subcategories").select("name,description").eq("id",s.subcategory_id).maybeSingle():Promise.resolve({data:null}),sb.from("spectrum_submission_reviews").select("*").eq("submission_id",id).order("created_at",{ascending:false})]);
document.getElementById("review").innerHTML='<div class="card"><div class="kicker">SUBMISSION</div><h2>'+escR(s.title)+'</h2><p>'+escR(s.description||"No description provided.")+'</p><div class="grid"><div><b>Status</b><br>'+escR(s.status)+'</div><div><b>Type</b><br>'+escR(s.submission_type)+'</div><div><b>Category</b><br>'+escR(cat.data?.name||"Unassigned")+'</div><div><b>Subcategory</b><br>'+escR(sub.data?.name||"Unassigned")+'</div><div><b>Submitted</b><br>'+escR(new Date(s.created_at).toLocaleString())+'</div><div><b>Submitter Note</b><br>'+escR(s.submitter_note||"None")+'</div></div></div><div class="card" style="margin-top:20px"><h2>Review Decision</h2><div class="actions"><button class="btn" data-status="eligible">Eligible</button><button class="btn" data-status="consideration">Consideration</button><button class="btn" data-status="ineligible">Ineligible</button><button class="btn primary" id="publish">Publish Official Nominee</button></div></div><div class="card" style="margin-top:20px"><h2>Review History</h2>'+((revs.data||[]).map(x=>'<div class="item"><b>'+escR(x.to_status)+'</b><br><small>'+escR(x.note||"No note")+'</small></div>').join("")||'<div class="notice">No review history yet.</div>')+'</div>';
document.querySelectorAll("[data-status]").forEach(b=>b.addEventListener("click",async()=>{const note=prompt("Optional review note:")||null;const z=await sb.rpc("spectrum_hq_review_submission",{p_submission_id:id,p_to_status:b.dataset.status,p_category_id:null,p_note:note});if(z.error)showMsg(z.error.message,"error");else{showMsg("Submission updated.");await loadReview()}}));
document.getElementById("publish").addEventListener("click",async()=>{if(!confirm("Publish this submission as an official nominee?"))return;const z=await sb.rpc("spectrum_hq_publish_nominee",{p_submission_id:id});if(z.error)showMsg(z.error.message,"error");else{showMsg("Official nominee published.");await loadReview()}})}
document.addEventListener("DOMContentLoaded",loadReview);
</script></body></html>
