<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Spectrum Awards | My Votes</title><link rel="stylesheet" href="css/spectrum.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="https://crowrulesentertainment-oss.github.io/crowrulesentertainment/js/crowrules-sitewide.js?v=3" defer></script><script src="https://crowrulesentertainment-oss.github.io/crowrulesentertainment/js/crowrules-universal-member.js?v=2" defer></script><script src="js/spectrum.js"></script></head><body><header class="topbar"><nav class="nav"><a class="brand" href="home.html">SPECTRUM<span>AWARDS</span></a><button class="menu">☰</button><div id="global-nav" class="navlinks"></div><div id="member-status"></div></nav></header><main class="wrap"><section class="section"><div class="eyebrow">UNIVERSAL MEMBERSHIP</div><h1>MY VOTES</h1><p class="lead">Review the Spectrum Awards ballots recorded under your CrowRules Membership account.</p><div id="message"></div><div id="my-votes"><div class="notice">Checking your membership…</div></div></section></main><footer class="footer"><div class="wrap">Spectrum Awards • One Account. One Universe.</div></footer><script>
document.addEventListener("DOMContentLoaded",async()=>{await initSpectrum();const box=document.getElementById("my-votes"),user=await requireAuth();if(!user)return;const r=await sb.from("spectrum_ballots").select("id,voting_config_id,category_id,nominee_id,cast_at").eq("user_id",user.id).order("cast_at",{ascending:false});if(r.error){box.innerHTML='<div class="notice error">'+esc(r.error.message)+'</div>';return}const rows=r.data||[];if(!rows.length){box.innerHTML='<div class="notice">You have not cast any Spectrum Awards votes yet. <a href="pre-voting.html">Go to voting →</a></div>';return}
const cids=[...new Set(rows.map(x=>x.category_id).filter(Boolean))],nids=[...new Set(rows.map(x=>x.nominee_id).filter(Boolean))],vids=[...new Set(rows.map(x=>x.voting_config_id).filter(Boolean))];const [cr,nr,vr]=await Promise.all([sb.from("spectrum_categories").select("id,name").in("id",cids),sb.from("spectrum_nominees").select("id,name,description,subcategory_id,status").in("id",nids),sb.from("spectrum_voting_config").select("id,award_id,voting_status,opens_at,closes_at,certified_at").in("id",vids)]);const cm=Object.fromEntries((cr.data||[]).map(x=>[x.id,x.name])),nm=Object.fromEntries((nr.data||[]).map(x=>[x.id,x])),vm=Object.fromEntries((vr.data||[]).map(x=>[x.id,x]));const sids=[...new Set((nr.data||[]).map(x=>x.subcategory_id).filter(Boolean))];const sr=sids.length?await sb.from("spectrum_subcategories").select("id,name").in("id",sids):{data:[]};const sm=Object.fromEntries((sr.data||[]).map(x=>[x.id,x.name]));const label=s=>String(s||"").replaceAll("_"," ").toUpperCase();const fmt=d=>d?new Date(d).toLocaleString():"—";
box.innerHTML='<div class="filters"><input id="vote-search" type="search" placeholder="Search your votes…"><select id="vote-config"><option value="">All Voting Rounds</option>'+Object.entries(vm).map(([id,v])=>'<option value="'+esc(id)+'">'+esc(label(v.voting_status))+' • '+esc(fmt(v.opens_at))+'</option>').join("")+'</select></div><div id="vote-count" class="kicker"></div><div id="vote-results"></div>';
const draw=()=>{const q=(document.getElementById("vote-search").value||"").toLowerCase().trim(),vf=document.getElementById("vote-config").value;const out=rows.filter(x=>(!vf||x.voting_config_id===vf)&&(!q||((nm[x.nominee_id]?.name||"")+" "+(cm[x.category_id]||"")+" "+(sm[nm[x.nominee_id]?.subcategory_id]||"")).toLowerCase().includes(q)));document.getElementById("vote-count").textContent=out.length+" ballot"+(out.length===1?"":"s");document.getElementById("vote-results").innerHTML=out.map(x=>{const n=nm[x.nominee_id]||{},v=vm[x.voting_config_id]||{};return '<article class="card"><div class="kicker">'+esc(cm[x.category_id]||"Category")+(sm[n.subcategory_id]?" • "+esc(sm[n.subcategory_id]):"")+'</div><h3>'+esc(n.name||"Nominee unavailable")+'</h3><p><span class="chip">'+esc(label(v.voting_status||"unknown"))+'</span></p><p><b>Vote cast:</b> '+esc(fmt(x.cast_at))+'</p>'+(v.opens_at||v.closes_at?'<small>Voting window: '+esc(fmt(v.opens_at))+' → '+esc(fmt(v.closes_at))+'</small>':"")+(n.status==="winner"?'<p><span class="chip official">WINNER</span></p>':"")+'</article>'}).join("")||'<div class="notice">No votes match your filters.</div>'};document.getElementById("vote-search").addEventListener("input",draw);document.getElementById("vote-config").addEventListener("change",draw);draw();
});</script></body></html>
