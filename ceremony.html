<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#020205"><title>Spectrum Awards | Ceremony Center</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="assets/supabase.js"></script><style>@import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&family=Orbitron:wght@600;800&display=swap');*{box-sizing:border-box}body{margin:0;background:#020205;color:#fff;font-family:Montserrat,Arial}.wrap{width:min(1160px,calc(100% - 32px));margin:auto;padding:40px 0 80px}.ey{font:700 11px Orbitron;letter-spacing:3px;color:#32e6ff}.hero{padding:55px 0}h1{font:800 clamp(40px,7vw,82px) Orbitron;letter-spacing:-4px;margin:10px 0}.muted{color:#9c9caf;line-height:1.8}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:16px}.card{padding:24px;border:1px solid rgba(255,255,255,.11);border-radius:20px;background:rgba(10,10,18,.75)}.card h2{font:800 22px Orbitron}.count{font:800 clamp(34px,6vw,60px) Orbitron;color:#32e6ff}.btn{display:inline-block;margin:8px 8px 0 0;padding:12px 15px;border-radius:10px;background:linear-gradient(100deg,#32e6ff,#9b5cff);color:#fff;text-decoration:none;font-weight:800;font-size:11px}.back{color:#32e6ff;text-decoration:none;font-size:12px}.status{display:inline-block;padding:8px 12px;border-radius:99px;background:rgba(50,230,255,.08);color:#32e6ff;font:700 11px Orbitron}.winner{border-color:rgba(255,190,70,.35)}</style></head><body><div class="wrap"><a class="back" href="index.html">← Spectrum Awards</a><section class="hero"><div class="ey">LIVE CEREMONY CENTER</div><h1 id="title">SPECTRUM</h1><p class="muted" id="desc">Loading the current ceremony state…</p><span id="state" class="status">CHECKING</span><div id="actions"></div></section><div class="grid"><article class="card"><div class="ey">COUNTDOWN</div><div id="count" class="count">—</div><p class="muted" id="countText">Ceremony time will appear when an edition has a scheduled ceremony.</p></article><article class="card"><div class="ey">WINNERS</div><div id="winnerCount" class="count">0</div><p class="muted">Certified winners for this edition.</p></article><article class="card"><div class="ey">NOMINEES</div><div id="nomineeCount" class="count">0</div><p class="muted">Published nominees in the current edition.</p></article></div><section style="margin-top:60px"><div class="ey">WINNER SPOTLIGHT</div><div id="winners" class="grid" style="margin-top:18px"></div></section></div><script>(async()=>{const $=id=>document.getElementById(id),esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));let timer;try{const db=await window.CrowRulesMembership.loadCrowRulesSupabase();const {data,error}=await db.from("spectrum_awards").select("id,award_year,title,status,ceremony_at,description").order("award_year",{ascending:false}).limit(1);if(error)throw error;const s=data?.[0];if(!s){$("title").textContent="CEREMONY CENTER";$("desc").textContent="No Spectrum Awards edition has been created yet.";return}$("title").textContent=s.award_year+" — "+s.title;$("desc").textContent=s.description||"The live home for the Spectrum Awards ceremony experience.";$("state").textContent=s.status.toUpperCase();$("actions").innerHTML='<a class="btn" href="season.html?year='+encodeURIComponent(s.award_year)+'">SEASON</a><a class="btn" href="archive.html">ARCHIVE</a>';const [n,w]=await Promise.all([db.from("spectrum_award_nominees").select("id",{count:"exact",head:true}).eq("award_id",s.id).eq("is_published",true).eq("status","approved"),db.from("spectrum_award_certified_results").select("nominee_name,project_name,description,vote_count,certified_at").eq("award_id",s.id).eq("result_status","winner").order("certified_at",{ascending:false})]);$("nomineeCount").textContent=String(n.count??0);$("winnerCount").textContent=String(w.data?.length??0);$("winners").innerHTML=(w.data||[]).map(x=>'<article class="card winner"><div class="status">CERTIFIED WINNER</div><h2>'+esc(x.nominee_name)+'</h2><p class="muted">'+esc(x.project_name||"")+'</p><p class="muted">'+esc(x.description||"")+'</p></article>').join("")||'<article class="card"><p class="muted">Winner spotlight will activate after results are certified.</p></article>';function tick(){if(!s.ceremony_at){$("count").textContent="TBA";return}const d=new Date(s.ceremony_at)-Date.now();if(d<=0){$("count").textContent="LIVE";$("countText").textContent="The scheduled ceremony time has arrived.";clearInterval(timer);return}const days=Math.floor(d/86400000),hrs=Math.floor(d/3600000)%24,mins=Math.floor(d/60000)%60,secs=Math.floor(d/1000)%60;$("count").textContent=days+"D "+hrs+"H "+mins+"M";$("countText").textContent=secs+" seconds remaining • "+new Date(s.ceremony_at).toLocaleString()}tick();timer=setInterval(tick,1000)}catch(e){$("desc").textContent="Ceremony data is temporarily unavailable.";console.error(e)}})();</script></body></html>
