<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#090713">
  <meta name="description" content="CrowRules Spectrum Awards — Coming Soon. Under Development.">
  <title>Spectrum Awards | CrowRules Entertainment</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&family=Orbitron:wght@500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root{color-scheme:dark;--bg:#090713;--cyan:#55e7ff;--purple:#a77bff;--pink:#ff75d8;--muted:#b7b1cb}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:grid;place-items:center;overflow:hidden;background:radial-gradient(ellipse at 18% 20%,#39205d80,transparent 38%),radial-gradient(ellipse at 82% 78%,#163b6380,transparent 40%),var(--bg);color:#fff;font-family:Montserrat,Arial,sans-serif}
    body:before{content:"";position:fixed;inset:0;pointer-events:none;background:linear-gradient(#ffffff08 1px,transparent 1px),linear-gradient(90deg,#ffffff08 1px,transparent 1px);background-size:46px 46px;mask-image:linear-gradient(to bottom,black,transparent 90%)}
    main{position:relative;width:min(900px,92vw);padding:clamp(2rem,7vw,5rem) 1.5rem;text-align:center}
    .orb{width:86px;height:86px;margin:0 auto 2rem;border:1px solid #55e7ff9c;border-radius:26px;display:grid;place-items:center;transform:rotate(45deg);box-shadow:0 0 35px #55e7ff25,inset 0 0 28px #a77bff20}
    .orb span{transform:rotate(-45deg);font-family:Orbitron,sans-serif;font-size:2rem;font-weight:800;color:var(--cyan);text-shadow:0 0 18px #55e7ff80}
    .eyebrow{font-size:.72rem;font-weight:800;letter-spacing:.34em;text-transform:uppercase;color:var(--cyan)}
    h1{margin:1rem 0;font-family:Orbitron,sans-serif;font-size:clamp(2.4rem,8vw,5.6rem);line-height:1.1;letter-spacing:-.04em}
    h1 span{display:block;background:linear-gradient(100deg,var(--cyan),var(--purple) 52%,var(--pink));background-clip:text;-webkit-background-clip:text;color:transparent}
    .status{display:inline-flex;align-items:center;gap:.7rem;margin:1.4rem 0;padding:.8rem 1.1rem;border:1px solid #a77bff80;border-radius:999px;background:#a77bff12;font-size:.78rem;font-weight:800;letter-spacing:.14em}
    .dot{width:8px;height:8px;border-radius:50%;background:var(--pink);box-shadow:0 0 12px var(--pink)}
    p{max-width:590px;margin:0 auto;color:var(--muted);font-size:clamp(.98rem,2vw,1.12rem);line-height:1.8}
    footer{margin-top:3.5rem;color:#827b99;font-size:.75rem;letter-spacing:.08em}
    footer strong{color:#c7c0db}
  </style>
</head>
<body>
  <main>
    <div class="orb" aria-hidden="true"><span>S</span></div>
    <div class="eyebrow">CrowRules Entertainment Presents</div>
    <h1><span>Spectrum</span>Awards</h1>
    <div class="status"><span class="dot" aria-hidden="true"></span> COMING SOON · UNDER DEVELOPMENT</div>
    <p>A new celebration of creativity, talent, and the people shaping entertainment. The Spectrum Awards are in development at CrowRules Entertainment.</p>
    <footer><strong>CrowRules Entertainment</strong><br>One company. One universe.</footer>
  </main>
</body>
</html>
