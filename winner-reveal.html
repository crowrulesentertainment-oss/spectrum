<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#000"><title>Spectrum Awards | Winner Reveal</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="assets/supabase.js"></script><style>@import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@500;700;800&family=Orbitron:wght@700;800&display=swap');*{box-sizing:border-box}body{margin:0;background:#000;color:#fff;font-family:Montserrat;overflow:hidden}.screen{min-height:100vh;display:grid;place-items:center;text-align:center;padding:6vw;position:relative;background:radial-gradient(circle at 50% 45%,rgba(110,55,180,.25),transparent 42%)}.ey{font:800 13px Orbitron;letter-spacing:5px;color:#32e6ff}.category{font:700 clamp(18px,3vw,34px);color:#c9c9d6;margin:22px 0}.winner{font:800 clamp(46px,9vw,120px) Orbitron;line-height:1.02;color:#ffd66b;text-shadow:0 0 40px rgba(255,214,107,.35);opacity:0;transform:scale(.72)}.project{font-size:clamp(20px,3vw,40px);color:#fff;margin-top:18px;opacity:0}.line{width:min(500px,70vw);height:2px;background:#32e6ff;margin:30px auto;transform:scaleX(0)}.ready .winner{animation:reveal 1.2s cubic-bezier(.2,.8,.2,1) .8s forwards}.ready .project{animation:fade 1s 1.45s forwards}.ready .line{animation:line 1s .3s forwards}@keyframes reveal{to{opacity:1;transform:scale(1)}}@keyframes fade{to{opacity:1}}@keyframes line{to{transform:scaleX(1)}}.idle{opacity:.45}.err{position:fixed;inset:0;display:grid;place-items:center;color:#ff5c88;font-weight:800}.hint{position:fixed;bottom:18px;left:0;right:0;color:#666;font-size:11px;letter-spacing:2px}@media(prefers-reduced-motion:reduce){*{animation:none!important;opacity:1!important;transform:none!important}}</style></head><body><main id="screen" class="screen"><section><div id="ey" class="ey">SPECTRUM AWARDS</div><div id="category" class="category">STANDBY</div><div class="line"></div><div id="winner" class="winner">WINNER</div><div id="project" class="project">—</div></section><div id="hint" class="hint">WAITING FOR WINNER REVEAL</div></main><div id="error" class="err"></div><script>(async()=>{const $=id=>document.getElementById(id);let db,season;async function init(){const m=await CrowRulesMembership.getCrowRulesMember();db=m.client;if(!m.user)throw Error("Sign in required.");const a=await db.rpc("crplus_is_admin");if(a.error||!a.data)throw Error("Administrator access is required.");const q=await db.from("spectrum_awards").select("id,award_year,title").order("award_year",{ascending:false}).limit(1);if(q.error||!q.data?.length)throw Error(q.error?.message||"No Spectrum season exists.");season=q.data[0];await render();db.channel("spectrum-winner-reveal").on("postgres_changes",{event:"*",schema:"public",table:"spectrum_ceremony_cues"},render).subscribe()}async function render(){const q=await db.from("spectrum_ceremony_cues").select("id,segment_id,cue_type,title,instruction,status,sort_order").eq("ceremony_id",season.id).order("sort_order",{ascending:true});if(q.error)throw q.error;const x=(q.data||[]).filter(x=>x.status==="fired"&&x.cue_type==="winner_reveal").slice(-1)[0];if(!x){$("screen").className="screen";$("category").textContent="STANDBY";$("winner").textContent="WINNER";$("project").textContent="—";$("hint").textContent="WAITING FOR WINNER REVEAL";return}const wq=await db.from("spectrum_award_certified_results").select("nominee_name,project_name,category_id").eq("award_id",season.id).eq("result_status","winner");const winners=wq.data||[];const raw=(x.title||"").replace(/^WINNER REVEAL — /,"");const w=winners.find(a=>(a.project_name||a.nominee_name)===raw)||winners.find(a=>raw.includes(a.nominee_name));$("ey").textContent="SPECTRUM • "+season.award_year+" WINNER";$("category").textContent=x.instruction?.replace(/^Reveal /,"")||"WINNER REVEAL";$("winner").textContent=w?.nominee_name||raw;$("project").textContent=w?.project_name||"";$("hint").textContent="OFFICIAL CERTIFIED WINNER";$("screen").className="screen ready";setTimeout(()=>{$("screen").className="screen ready"},120)}try{await init()}catch(e){$("error").textContent=e.message}})();</script></body></html>
