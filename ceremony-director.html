<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#020205"><title>Spectrum Awards | Ceremony Director</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="assets/supabase.js"></script><style>@import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&family=Orbitron:wght@600;800&display=swap');*{box-sizing:border-box}body{margin:0;background:#010107;color:#fff;font:15px Montserrat,Arial}.wrap{width:min(1400px,calc(100% - 28px));margin:auto;padding:24px 0 60px}.ey{color:#32e6ff;font:800 11px Orbitron;letter-spacing:3px}.top{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}h1{font:800 clamp(32px,6vw,68px) Orbitron;letter-spacing:-3px;margin:8px 0}.card{background:#090912;border:1px solid #29293a;border-radius:18px;padding:20px;margin:14px 0}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.big{font:800 clamp(30px,5vw,58px) Orbitron;color:#32e6ff}.label{color:#9696a8;font-size:11px;text-transform:uppercase;letter-spacing:1px}.queue{display:grid;gap:8px}.cue{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:14px;border:1px solid #252535;border-radius:12px}.current{border-color:#32e6ff;box-shadow:0 0 25px rgba(50,230,255,.1)}button,a{padding:14px 18px;border:0;border-radius:10px;background:#32e6ff;color:#020207;font-weight:800;text-decoration:none;cursor:pointer}.hold{background:#ffd76a}.danger{background:#e33b72;color:#fff}.muted{color:#999aaa;line-height:1.6}@media(max-width:800px){.grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:500px){.grid{grid-template-columns:1fr}.cue{align-items:flex-start;flex-direction:column}}</style></head><body><div class="wrap"><div class="top"><div><div class="ey">CROWRULES • SPECTRUM AWARDS</div><h1>CEREMONY DIRECTOR</h1><div class="muted">Full-screen live production operator view.</div></div><div><a href="ceremony-admin.html">CONTROL ROOM</a></div></div><section class="card"><div class="grid"><div><div class="label">Edition</div><div id="edition" class="big">—</div></div><div><div class="label">Production</div><div id="production" class="big">STANDBY</div></div><div><div class="label">Clock</div><div id="clock" class="big">—</div></div><div><div class="label">Next Cue</div><div id="next" class="big">—</div></div></div></section><section class="card"><div class="ey">DIRECTOR CONTROLS</div><div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:12px"><button id="fire">FIRE NEXT CUE</button><button id="standby" class="hold">STANDBY</button><button id="hold" class="danger">HOLD</button></div><p id="message" class="muted">Loading…</p></section><section class="card"><div class="ey">CURRENT / NEXT</div><div class="grid"><div><div class="label">Current Cue</div><div id="current" class="big">STANDBY</div></div><div><div class="label">Cue Type</div><div id="type" class="big">—</div></div><div><div class="label">Countdown</div><div id="countdown" class="big">—</div></div><div><div class="label">Instruction</div><div id="instruction" class="muted">—</div></div></div></section><section class="card"><div class="ey">UPCOMING QUEUE</div><div id="queue" class="queue">Loading…</div></section></div><script>(async()=>{const $=id=>document.getElementById(id);let db,season,cues=[],mode="STANDBY";function esc(s){return String(s??"").replace(/[&<>"]/g,x=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[x]))}async function init(){const m=await CrowRulesMembership.getCrowRulesMember();db=m.client;if(!m.user)throw Error("Sign in required.");const a=await db.rpc("crplus_is_admin");if(a.error||!a.data)throw Error("Administrator access is required.");const q=await db.from("spectrum_awards").select("id,award_year,title,status,ceremony_at").order("award_year",{ascending:false}).limit(1);if(q.error)throw q.error;if(!q.data?.length)throw Error("No Spectrum season exists.");season=q.data[0];$("edition").textContent=season.award_year+"";await refresh();db.channel("spectrum-director-cues").on("postgres_changes",{event:"*",schema:"public",table:"spectrum_ceremony_cues"},()=>refresh()).subscribe();}async function refresh(){const q=await db.from("spectrum_ceremony_cues").select("id,cue_type,title,instruction,cue_at,status,sort_order").eq("ceremony_id",season.id).order("sort_order",{ascending:true});if(q.error)throw q.error;cues=q.data||[];const pending=cues.filter(x=>(x.status||"pending")!=="fired");const current=cues.filter(x=>x.status==="fired").slice(-1)[0];const next=pending[0];$("current").textContent=current?.title||"STANDBY";$("type").textContent=current?.cue_type||"—";$("next").textContent=next?.title||"—";$("instruction").textContent=next?.instruction||next?.cue_type||"No queued cue.";$("production").textContent=mode;$("fire").disabled=!next;$("queue").innerHTML=pending.slice(0,10).map((x,i)=>'<div class="cue '+(i===0?'current':'')+'"><div><strong>'+esc((i+1)+". "+x.title)+'</strong><div class="muted">'+esc(x.cue_type)+" · "+esc(x.status||"pending")+'</div></div><span>'+esc(x.cue_at?new Date(x.cue_at).toLocaleTimeString():"MANUAL")+"</span></div>").join("")||'<div class="muted">Queue clear.</div>';window.nextCue=next}async function fire(){const x=window.nextCue;if(!x)return;const r=await db.rpc("spectrum_fire_cue",{p_cue_id:x.id,p_status:"fired"});if(r.error){$("message").textContent=r.error.message;return}mode="LIVE";$("message").textContent="Cue fired: "+x.title;await refresh()}$("fire").onclick=fire;$("standby").onclick=()=>{mode="STANDBY";$("message").textContent="Production placed on STANDBY.";refresh()};$("hold").onclick=()=>{mode="HOLD";$("message").textContent="Production HOLD active. No cue was fired.";refresh()};setInterval(()=>{$("clock").textContent=new Date().toLocaleTimeString();const x=window.nextCue;if(!x?.cue_at){$("countdown").textContent="MANUAL";return}const ms=new Date(x.cue_at)-Date.now();if(ms<=0){$("countdown").textContent="NOW";return}const s=Math.floor(ms/1000);$("countdown").textContent=Math.floor(s/60)+":"+String(s%60).padStart(2,"0")},1000);try{await init()}catch(e){$("message").textContent=e.message}})();</script></body></html>
