<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#020205"><title>Spectrum Awards | Season</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="assets/supabase.js"></script><style>@import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&family=Orbitron:wght@600;800&display=swap');*{box-sizing:border-box}body{margin:0;background:#020205;color:#fff;font-family:Montserrat,Arial}.wrap{width:min(1180px,calc(100% - 32px));margin:auto;padding:40px 0 80px}.ey{font:700 11px Orbitron;letter-spacing:3px;color:#32e6ff}.hero{padding:55px 0}h1{font:800 clamp(38px,7vw,78px) Orbitron;letter-spacing:-4px;margin:10px 0}.muted{color:#9c9caf;line-height:1.75}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:15px;margin-top:22px}.card{padding:22px;border:1px solid rgba(255,255,255,.11);border-radius:18px;background:rgba(10,10,18,.75)}.card h2{font:800 20px Orbitron}.pill{display:inline-block;padding:6px 9px;border-radius:99px;background:rgba(155,92,255,.12);color:#caaeff;font:700 10px Orbitron}.back{color:#32e6ff;text-decoration:none;font-size:12px}.empty{padding:24px;border:1px dashed #303044;border-radius:18px;color:#9c9caf}.count{font:800 30px Orbitron;color:#32e6ff}.btn{display:inline-block;margin:8px 7px 0 0;padding:11px 14px;border-radius:10px;background:linear-gradient(100deg,#32e6ff,#9b5cff);color:#fff;text-decoration:none;font-weight:800;font-size:11px}</style></head><body><div class="wrap"><a class="back" href="archive.html">← Spectrum Archive</a><section class="hero"><div class="ey">SPECTRUM AWARDS EDITION</div><h1 id="title">Loading…</h1><p class="muted" id="desc"></p><div id="actions"></div></section><section><div class="ey">CATEGORIES</div><div id="cats" class="grid"></div></section><section style="margin-top:65px"><div class="ey">NOMINEES</div><div id="nominees" class="grid"></div></section><section style="margin-top:65px"><div class="ey">CERTIFIED WINNERS</div><div id="winners" class="grid"></div></section></div><script>(async()=>{const $=id=>document.getElementById(id),esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));try{const db=await window.CrowRulesMembership.loadCrowRulesSupabase();const year=new URLSearchParams(location.search).get("year");let q=db.from("spectrum_awards").select("id,award_year,title,status,ceremony_at,description").order("award_year",{ascending:false});if(year)q=q.eq("award_year",Number(year));const {data,error}=await q.limit(1);if(error)throw error;const s=data?.[0];if(!s){$("title").textContent="Edition not found";$("desc").textContent="No Spectrum Awards edition matches this archive request.";return}$("title").textContent=s.award_year+" — "+s.title;$("desc").textContent=s.description||("Spectrum Awards "+s.award_year+" • "+s.status);$("actions").innerHTML='<a class="btn" href="index.html">SPECTRUM HOME</a><a class="btn" href="winners.html">WINNERS</a>';const [cat,nom,win]=await Promise.all([db.from("spectrum_award_categories").select("name,description,category_type").eq("is_active",true).order("sort_order"),db.from("spectrum_award_nominees").select("nominee_name,project_name,description,status,is_published").eq("award_id",s.id).eq("is_published",true).eq("status","approved").order("nominee_name"),db.from("spectrum_award_certified_results").select("nominee_name,project_name,description,vote_count,certified_at").eq("award_id",s.id).eq("result_status","winner").order("certified_at",{ascending:false})]);$("cats").innerHTML=(cat.data||[]).map(x=>'<article class="card"><span class="pill">'+esc(x.category_type||"SPECTRUM")+'</span><h2>'+esc(x.name)+'</h2><p class="muted">'+esc(x.description||"")+'</p></article>').join("")||'<div class="empty">No published categories yet.</div>';$("nominees").innerHTML=(nom.data||[]).map(x=>'<article class="card"><h2>'+esc(x.nominee_name)+'</h2><p class="muted">'+esc(x.project_name||"")+'</p><p class="muted">'+esc(x.description||"")+'</p></article>').join("")||'<div class="empty">No published nominees yet.</div>';$("winners").innerHTML=(win.data||[]).map(x=>'<article class="card"><span class="pill">WINNER</span><h2>'+esc(x.nominee_name)+'</h2><p class="muted">'+esc(x.project_name||"")+'</p><p class="count">'+esc(x.vote_count??0)+'</p><p class="muted">certified votes</p></article>').join("")||'<div class="empty">No certified winners for this edition yet.</div>'}catch(e){$("title").textContent="Season unavailable";$("desc").textContent="Live Spectrum data is temporarily unavailable.";console.error(e)}})();</script></body></html>
