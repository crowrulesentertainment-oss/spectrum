<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Spectrum Awards | Nominate</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="assets/supabase.js"></script><style>body{margin:0;background:#030309;color:#fff;font:15px Montserrat,Arial;padding:28px}main{max-width:760px;margin:auto}.card{background:#0c0c16;border:1px solid #29293a;border-radius:20px;padding:28px;margin-top:20px}h1{font:800 40px Orbitron}.ey{color:#32e6ff;font:700 11px Orbitron;letter-spacing:3px}label{display:block;margin:18px 0 7px;color:#aaa}input,select,textarea{width:100%;padding:13px;border-radius:10px;border:1px solid #333;background:#07070d;color:#fff}textarea{min-height:120px}button{margin-top:22px;padding:14px 20px;border:0;border-radius:10px;background:linear-gradient(90deg,#32e6ff,#9b5cff,#ff3ca6);color:#fff;font-weight:900}.status{margin-top:16px;color:#aaa}.back{color:#32e6ff}</style></head><body><main><a class="back" href="index.html">← Spectrum Awards</a><div class="card"><div class="ey">SPECTRUM AWARDS</div><h1>Nominate</h1><p>Submit a person, project, or work for consideration. A CrowRules universal account is required.</p><form id="form"><label>Category</label><select id="category" required><option value="">Loading categories…</option></select><label>Nominee Name</label><input id="name" required maxlength="200"><label>Email (optional)</label><input id="email" type="email" maxlength="320"><label>Project / Work</label><input id="project" maxlength="200"><label>Nominee Type</label><input id="type" placeholder="Artist, creator, show, film, podcast, etc."><label>Why should they be considered?</label><textarea id="desc" maxlength="3000"></textarea><button type="submit">SUBMIT NOMINATION</button><div class="status" id="status"></div></form></div></main><script>
const cat=document.getElementById("category"),status=document.getElementById("status"),esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
async function init(){const m=await CrowRulesMembership.getCrowRulesMember();if(!m.user){status.textContent="Please sign in first.";return}const {data,error}=await m.client.from("spectrum_award_categories").select("id,name").eq("is_active",true).order("sort_order");if(error){status.textContent=error.message;return}cat.innerHTML=(data||[]).map(x=>'<option value="'+x.id+'">'+esc(x.name)+'</option>').join("")||'<option value="">No categories published</option>'}
document.getElementById("form").onsubmit=async e=>{e.preventDefault();status.textContent="Submitting…";const m=await CrowRulesMembership.getCrowRulesMember();if(!m.user){location.href="login.html?next=nominate.html";return}const {error}=await m.client.from("spectrum_award_nominations").insert({category_id:Number(cat.value),nominee_name:document.getElementById("name").value.trim(),nominee_email:document.getElementById("email").value.trim()||null,project_name:document.getElementById("project").value.trim()||null,nominee_type:document.getElementById("type").value.trim()||null,description:document.getElementById("desc").value.trim()||null,submitted_by_user_id:m.user.id,status:"submitted"});status.textContent=error?error.message:"Nomination submitted. Thank you.";if(!error)e.target.reset()};
init().catch(e=>status.textContent=e.message);
</script></body></html>
