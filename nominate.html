<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Spectrum Awards | Nominate</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="assets/supabase.js"></script><style>body{margin:0;background:#030309;color:#fff;font:15px Montserrat,Arial;padding:28px}main{max-width:760px;margin:auto}.card{background:#0c0c16;border:1px solid #29293a;border-radius:20px;padding:28px;margin-top:20px}h1{font:800 40px Orbitron}.ey{color:#32e6ff;font:700 11px Orbitron;letter-spacing:3px}label{display:block;margin:18px 0 7px;color:#aaa}input,select,textarea{width:100%;padding:13px;border-radius:10px;border:1px solid #333;background:#07070d;color:#fff;box-sizing:border-box}textarea{min-height:120px}button{margin-top:22px;padding:14px 20px;border:0;border-radius:10px;background:linear-gradient(90deg,#32e6ff,#9b5cff,#ff3ca6);color:#fff;font-weight:900}.status{margin-top:16px;color:#aaa}.back{color:#32e6ff}</style></head><body><main><a class="back" href="index.html">← Spectrum Awards</a><div class="card"><div class="ey">SPECTRUM AWARDS</div><h1>Nominate</h1><p id="intro">Submit a person, project, or work for consideration.</p><form id="form"><label>Category</label><select id="category" required></select><label>Nominee Name</label><input id="name" required maxlength="200"><label>Email (optional)</label><input id="email" type="email" maxlength="320"><label>Project / Work</label><input id="project" maxlength="200"><label>Nominee Type</label><input id="type" placeholder="Artist, creator, show, film, podcast, etc."><label>Why should they be considered?</label><textarea id="desc" maxlength="3000"></textarea><button type="submit">SUBMIT NOMINATION</button><div class="status" id="status"></div></form></div></main><script>let activeSeason=null,db;const $=id=>document.getElementById(id),esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));async function init(){const m=await CrowRulesMembership.getCrowRulesMember();db=m.client;if(!m.user){$("status").innerHTML='Please sign in first. <a href="login.html?next=nominate.html" style="color:#32e6ff">SIGN IN</a>';return}const q=await db.from("spectrum_awards").select("id,award_year,title,status").in("status",["planned","nominations"]).order("award_year",{ascending:false}).limit(1);activeSeason=q.data?.[0];if(!activeSeason){$("status").textContent="No awards season is currently accepting nominations.";return}$("intro").textContent="Nominations are open for "+activeSeason.award_year+" — "+activeSeason.title+". A CrowRules universal account is required.";const c=await db.from("spectrum_award_categories").select("id,name").eq("is_active",true).order("sort_order");if(c.error){$("status").textContent=c.error.message;return}$("category").innerHTML=(c.data||[]).map(x=>'<option value="'+x.id+'">'+esc(x.name)+'</option>').join("")||'<option value="">No categories published</option>';$("form").addEventListener("submit",submitNom)}async function submitNom(e){e.preventDefault();if(!activeSeason)return;const m=await CrowRulesMembership.getCrowRulesMember();$("status").textContent="Submitting…";const r=await m.client.rpc("spectrum_submit_nomination",{p_award_id:activeSeason.id,p_category_id:Number($("category").value),p_nominee_name:$("name").value.trim(),p_nominee_email:$("email").value.trim()||null,p_project_name:$("project").value.trim()||null,p_nominee_type:$("type").value.trim()||null,p_description:$("desc").value.trim()||null});if(r.error){$("status").textContent=r.error.message;return}$("status").textContent="Nomination submitted successfully.";$("form").reset()}init().catch(e=>$("status").textContent=e.message);</script></body></html>
