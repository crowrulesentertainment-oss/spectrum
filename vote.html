<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Spectrum Awards | Vote</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="assets/supabase.js"></script><style>body{margin:0;background:#030309;color:#fff;font:15px Montserrat,Arial;padding:28px}main{max-width:900px;margin:auto}.ey{color:#32e6ff;font:700 11px Orbitron;letter-spacing:3px}h1{font:800 40px Orbitron}.status{padding:15px;border:1px solid #29293a;border-radius:14px;color:#aaa}.cat{margin-top:22px;padding:22px;background:#0c0c16;border:1px solid #29293a;border-radius:18px}.nom{display:flex;justify-content:space-between;gap:15px;align-items:center;padding:14px 0;border-bottom:1px solid #222}.nom:last-child{border:0}.vote{padding:9px 14px;border:1px solid #32e6ff;background:transparent;color:#32e6ff;border-radius:9px}.back{color:#32e6ff}</style></head><body><main><a class="back" href="index.html">← Spectrum Awards</a><div class="ey">COMMUNITY VOTING</div><h1>Vote</h1><div class="status" id="status">Loading voting status…</div><div id="board"></div></main><script>
let cfg; const board=document.getElementById("board"),status=document.getElementById("status"),esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
async function init(){const m=await CrowRulesMembership.getCrowRulesMember();if(!m.user){status.innerHTML='Sign in to vote. <a href="login.html?next=vote.html" style="color:#32e6ff">SIGN IN</a>';return}cfg=(await m.client.from("spectrum_voting_config").select("*").order("created_at",{ascending:false}).limit(1)).data?.[0];if(!cfg||cfg.voting_status!=="open"){status.textContent=cfg?"Voting is currently "+cfg.voting_status+".":"Voting has not opened yet.";return}status.textContent="Voting is open.";const {data,error}=await m.client.from("spectrum_award_nominees").select("id,nominee_name,description,category_id").eq("status","approved").eq("is_published",true).order("name");if(error){status.textContent=error.message;return}const groups={};(data||[]).forEach(n=>(groups[n.category_id]??=[]).push(n));const cats=await m.client.from("spectrum_award_categories").select("id,name").eq("is_active",true).order("sort_order");board.innerHTML=(cats.data||[]).map(c=>'<section class="cat"><h2>'+esc(c.name)+'</h2>'+((groups[c.id]||[]).map(n=>'<div class="nom"><span><b>'+esc(n.nominee_name)+'</b><br><small>'+esc(n.description||"")+'</small></span><button class="vote" onclick="cast(\''+n.id+'\')">VOTE</button></div>').join("")||"<p>No nominees published.</p>")+'</section>').join("")}
async function cast(id){const m=await CrowRulesMembership.getCrowRulesMember();if(!m.user)return;const {data:nom,error:ne}=await m.client.from("spectrum_award_nominees").select("category_id").eq("id",id).single();if(ne){alert(ne.message);return}const {count}=await m.client.from("spectrum_award_votes").select("*",{count:"exact",head:true}).eq("voter_user_id",m.user.id).eq("nominee_id",id);if((count||0)>0){alert("You have already voted for this nominee.");return}const {data:catVotes,error:ce}=await m.client.from("spectrum_award_votes").select("nominee_id").eq("voter_user_id",m.user.id);if(ce){alert(ce.message);return}const ids=(catVotes||[]).map(x=>x.nominee_id);let used=0;if(ids.length){const q=await m.client.from("spectrum_award_nominees").select("id,category_id").in("id",ids).eq("category_id",nom.category_id);used=q.data?.length||0}const max=Number(cfg?.max_votes_per_category||1);if(used>=max){alert("You have reached the vote limit for this category.");return}const {error}=await m.client.from("spectrum_award_votes").insert({nominee_id:id,voter_user_id:m.user.id});alert(error?error.message:"Vote recorded.");}
init().catch(e=>status.textContent=e.message);
</script></body></html>
