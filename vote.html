<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Spectrum Awards | Vote</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="assets/supabase.js"></script><style>body{margin:0;background:#030309;color:#fff;font:15px Montserrat,Arial;padding:28px}main{max-width:900px;margin:auto}.ey{color:#32e6ff;font:700 11px Orbitron;letter-spacing:3px}h1{font:800 40px Orbitron}.status{padding:15px;border:1px solid #29293a;border-radius:14px;color:#aaa}.cat{margin-top:22px;padding:22px;background:#0c0c16;border:1px solid #29293a;border-radius:18px}.nom{display:flex;justify-content:space-between;gap:15px;align-items:center;padding:14px 0;border-bottom:1px solid #222}.nom:last-child{border:0}.vote{padding:9px 14px;border:1px solid #32e6ff;background:transparent;color:#32e6ff;border-radius:9px}.back{color:#32e6ff}</style></head><body><div id="spectrumSeasonBanner" style="display:none"></div><main><a class="back" href="index.html">← Spectrum Awards</a><div class="ey">COMMUNITY VOTING</div><h1>Vote</h1><div class="status" id="status">Loading voting status…</div><div id="board"></div></main><script>
let cfg; const board=document.getElementById("board"),status=document.getElementById("status"),esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
async function init(){const m=await CrowRulesMembership.getCrowRulesMember();if(!m.user){status.innerHTML='Sign in to vote. <a href="login.html?next=vote.html" style="color:#32e6ff">SIGN IN</a>';return}const q=await m.client.from("spectrum_voting_config").select("*").eq("voting_status","open").order("created_at",{ascending:false}).limit(1);cfg=q.data?.[0];if(!cfg){status.textContent="Voting is not currently open.";return}const season=await m.client.from("spectrum_awards").select("id,award_year,title,status").eq("id",cfg.award_id).maybeSingle();if(season.error||!season.data||season.data.status!=="voting"){status.textContent="Voting is not currently active for this season.";return}status.textContent="Voting is open for "+season.data.award_year+" — "+season.data.title+".";const {data,error}=await m.client.from("spectrum_award_nominees").select("id,nominee_name,description,category_id").eq("award_id",cfg.award_id).eq("status","approved").eq("is_published",true).order("nominee_name");if(error){status.textContent=error.message;return}const groups={};(data||[]).forEach(n=>(groups[n.category_id]??=[]).push(n));const cats=await m.client.from("spectrum_award_categories").select("id,name").eq("is_active",true).order("sort_order");board.innerHTML=(cats.data||[]).map(c=>'<section class="cat"><h2>'+esc(c.name)+'</h2>'+((groups[c.id]||[]).map(n=>'<div class="nom"><span><b>'+esc(n.nominee_name)+'</b><br><small>'+esc(n.description||"")+'</small></span><button class="vote" onclick="cast(\''+n.id+'\')">VOTE</button></div>').join("")||"<p>No nominees published.</p>")+'</section>').join("")}
async function cast(id){const m=await CrowRulesMembership.getCrowRulesMember();if(!m.user)return;const r=await m.client.rpc("spectrum_cast_award_vote",{p_voting_config_id:cfg.id,p_nominee_id:id});alert(r.error?r.error.message:"Vote recorded.");if(!r.error)init()}
init().catch(e=>status.textContent=e.message);
</script></body></html><script>
(async()=>{try{
 const m=await window.CrowRulesMembership.getCrowRulesMember(); if(!m?.client)return;
 const q=await m.client.from("spectrum_awards").select("id,award_year,title,status,ceremony_at,description").in("status",["planned","nominations","voting","ceremony"]).order("award_year",{ascending:false}).limit(1);
 const a=q.data?.[0]; if(!a)return;
 const el=document.getElementById("spectrumSeasonBanner"); if(!el)return;
 el.style.cssText="display:block;margin:14px auto;padding:12px 16px;max-width:1100px;border:1px solid rgba(50,230,255,.25);border-radius:12px;background:rgba(50,230,255,.04);color:#dfefff;font:700 11px Montserrat;letter-spacing:.5px";
 el.innerHTML="ACTIVE SPECTRUM SEASON · "+String(a.award_year)+" — "+String(a.title).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
}catch(e){console.warn("Spectrum season:",e)}})();
</script>
