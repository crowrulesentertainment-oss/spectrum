<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Spectrum Awards | My Nominations</title><link rel="stylesheet" href="css/spectrum.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="https://crowrulesentertainment-oss.github.io/crowrulesentertainment/js/crowrules-sitewide.js?v=3" defer></script><script src="https://crowrulesentertainment-oss.github.io/crowrulesentertainment/js/crowrules-universal-member.js?v=2" defer></script><script src="js/spectrum.js"></script></head><body><header class="topbar"><nav class="nav"><a class="brand" href="home.html">SPECTRUM<span>AWARDS</span></a><button class="menu">☰</button><div id="global-nav" class="navlinks"></div><a class="btn" href="admin.html">Awards HQ</a><div id="member-status"></div></nav></header><main class="wrap"><section class="section"><div class="eyebrow">UNIVERSAL MEMBERSHIP</div><h1>MY NOMINATIONS</h1><p class="lead">Track your Spectrum Awards submissions from submission through review and official nominee status.</p><div id="message"></div><div id="my-nominations"><div class="notice">Checking your membership…</div></div></section></main><footer class="footer"><div class="wrap">Spectrum Awards • One Account. One Universe.</div></footer><script>
document.addEventListener("DOMContentLoaded",async()=>{
 await initSpectrum();
 const box=document.getElementById("my-nominations"),user=await requireAuth();
 if(!user)return;
 const r=await sb.from("spectrum_submissions").select("id,title,description,submission_type,status,submitter_note,created_at,updated_at,reviewed_at,category_id,subcategory_id").eq("user_id",user.id).order("created_at",{ascending:false});
 if(r.error){box.innerHTML='<div class="notice error">'+esc(r.error.message)+'</div>';return}
 const rows=r.data||[];
 if(!rows.length){box.innerHTML='<div class="notice">You have not submitted a Spectrum Awards nomination yet. <a href="nominations.html">Submit a nomination →</a></div>';return}
 const cids=[...new Set(rows.map(x=>x.category_id).filter(Boolean))],sids=[...new Set(rows.map(x=>x.subcategory_id).filter(Boolean))];
 const [cr,sr]=await Promise.all([cids.length?sb.from("spectrum_categories").select("id,name").in("id",cids):Promise.resolve({data:[]}),sids.length?sb.from("spectrum_subcategories").select("id,name").in("id",sids):Promise.resolve({data:[]})]);
 const cm=Object.fromEntries((cr.data||[]).map(x=>[x.id,x.name])),sm=Object.fromEntries((sr.data||[]).map(x=>[x.id,x.name]));
 const statusLabel=s=>String(s||"").replaceAll("_"," ").toUpperCase();
 const statusClass=s=>{const x=String(s||"").toLowerCase();return x==="official_nominee"?"official":x==="ineligible"||x==="withdrawn"?"error":x==="eligible"||x==="consideration"?"active":"pending"};
 box.innerHTML='<div class="filters"><input id="my-search" type="search" placeholder="Search your nominations…"><select id="my-status"><option value="">All Statuses</option>'+[...new Set(rows.map(x=>x.status))].sort().map(s=>'<option value="'+esc(s)+'">'+esc(statusLabel(s))+'</option>').join("")+'</select></div><div id="my-count" class="kicker"></div><div id="my-results"></div>';
 const draw=()=>{const q=(document.getElementById("my-search").value||"").toLowerCase().trim(),st=document.getElementById("my-status").value;const out=rows.filter(x=>(!st||x.status===st)&&(!q||((x.title||"")+" "+(x.description||"")+" "+(x.submitter_note||"")+" "+(cm[x.category_id]||"")+" "+(sm[x.subcategory_id]||"")).toLowerCase().includes(q)));document.getElementById("my-count").textContent=out.length+" submission"+(out.length===1?"":"s");document.getElementById("my-results").innerHTML=out.map(x=>'<a href="my-nomination.html?id='+encodeURIComponent(x.id)+'" class="card" style="display:block;text-decoration:none;color:inherit"><div class="kicker">'+esc(cm[x.category_id]||"Category")+(sm[x.subcategory_id]?" • "+esc(sm[x.subcategory_id]):"")+'</div><h3>'+esc(x.title)+'</h3><p>'+esc(x.description||"")+'</p><p><span class="chip '+statusClass(x.status)+'">'+esc(statusLabel(x.status))+'</span></p><small>Submitted: '+esc(new Date(x.created_at).toLocaleString())+(x.reviewed_at?" • Reviewed: "+esc(new Date(x.reviewed_at).toLocaleString()):"")+'</small>'+(x.submitter_note?'<p><b>Submission note:</b> '+esc(x.submitter_note)+'</p>':"")+(x.status==="official_nominee"?'<a class="btn primary" href="nominees.html">View Official Nominees →</a>':"")+'</a>').join("")||'<div class="notice">No nominations match your filters.</div>'};
 document.getElementById("my-search").addEventListener("input",draw);document.getElementById("my-status").addEventListener("change",draw);draw();
});
</script></body></html>
