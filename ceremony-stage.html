<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#000"><title>Spectrum Awards | Stage Display</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="assets/supabase.js"></script><style>@import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@500;700;800&family=Orbitron:wght@700;800&display=swap');*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% 20%,#15112a,#030307 58%);color:#fff;font-family:Montserrat;min-height:100vh}.screen{min-height:100vh;display:flex;flex-direction:column;justify-content:center;padding:6vw;text-align:center}.ey{font:800 13px Orbitron;letter-spacing:5px;color:#32e6ff}.edition{font:800 clamp(18px,2vw,28px) Orbitron;color:#aaa;margin:12px}.main{font:800 clamp(42px,9vw,130px) Orbitron;line-height:1.02;margin:15px 0}.sub{font-size:clamp(18px,3vw,36px);color:#c7c7d4}.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:45px}.card{padding:25px;border:1px solid #29293b;background:rgba(8,8,17,.75);border-radius:20px}.label{font:800 10px Orbitron;letter-spacing:3px;color:#999}.value{font:800 clamp(24px,4vw,48px) Orbitron;margin-top:12px}.live{color:#32e6ff}.winner{color:#ffd66b}.hidden{display:none}.err{color:#ff5c88}@media(max-width:700px){.grid{grid-template-columns:1fr}}</style></head><body><main class="screen"><div class="ey">CROWRULES • SPECTRUM AWARDS</div><div id="edition" class="edition">CEREMONY</div><div id="state" class="main">STANDBY</div><div id="subtitle" class="sub">Waiting for the next production cue</div><div class="grid"><section class="card"><div class="label">CURRENT SEGMENT</div><div id="segment" class="value">—</div></section><section class="card"><div class="label">PRESENTER</div><div id="presenter" class="value">—</div></section><section class="card"><div class="label">NEXT CUE</div><div id="next" class="value">—</div></section><section class="card"><div class="label">WINNER REVEAL</div><div id="winner" class="value winner">—</div></section></div><div id="error" class="err"></div></main><script>(async()=>{const $=id=>document.getElementById(id);let db,season,ceremonyId,cues=[],segments=[],presenters=[],winners=[];function esc(s){return String(s??"").replace(/[&<>"]/g,x=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[x]))}async function init(){const m=await CrowRulesMembership.getCrowRulesMember();db=m.client;if(!m.user)throw Error("Sign in required.");const a=await db.rpc("crplus_is_admin");if(a.error||!a.data)throw Error("Administrator access is required.");const q=await db.from("spectrum_awards").select("id,award_year,title").order("award_year",{ascending:false}).limit(1);if(q.error||!q.data?.length)throw Error(q.error?.message||"No Spectrum season exists.");season=q.data[0];$("edition").textContent=season.award_year+" • "+season.title;await refresh();db.channel("spectrum-stage-network").on("postgres_changes",{event:"*",schema:"public",table:"spectrum_ceremony_cues"},refresh).subscribe()}async function refresh(){const q=await db.from("spectrum_ceremony_cues").select("id,segment_id,cue_type,title,instruction,cue_at,status,sort_order").eq("ceremony_id",season.id).order("sort_order",{ascending:true});if(q.error)throw q.error;cues=q.data||[];const [s,p,w]=await Promise.all([db.from("spectrum_ceremony_segments").select("id,title,sort_order").eq("ceremony_id",season.id).order("sort_order"),db.from("spectrum_presenters").select("id,name,role,sort_order").eq("ceremony_id",season.id).order("sort_order"),db.from("spectrum_award_certified_results").select("nominee_name,project_name").eq("award_id",season.id).eq("result_status","winner")]);segments=s.data||[];presenters=p.data||[];winners=w.data||[];const fired=cues.filter(x=>x.status==="fired");const current=fired[fired.length-1], pending=cues.filter(x=>(x.status||"pending")!=="fired"),next=pending[0];$("state").textContent=current?.cue_type==="winner_reveal"?"WINNER REVEAL":current?.title||"STANDBY";$("state").className="main"+(current?.cue_type==="winner_reveal"?" winner":" live");$("subtitle").textContent=current?.instruction||"Waiting for the next production cue";$("next").textContent=next?.title||"QUEUE CLEAR";const seg=segments.find(x=>x.id===current?.segment_id);$("segment").textContent=seg?.title||"—";let presenter="—";if(seg){const idx=Math.max(0,segments.findIndex(x=>x.id===seg.id));presenter=presenters[idx]?.name||"—"}$("presenter").textContent=presenter;if(current?.cue_type==="winner_reveal"){const text=(current.title||"").replace(/^WINNER REVEAL — /,"");const w=winners.find(x=>(x.project_name||x.nominee_name)===text)||winners.find(x=>text.includes(x.nominee_name));$("winner").textContent=w?(w.project_name||w.nominee_name):text}else $("winner").textContent="—"}try{await init()}catch(e){$("error").textContent=e.message}})();</script></body></html>
