<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Spectrum Category Management</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="assets/supabase.js"></script><style>body{margin:0;background:#030309;color:#fff;font:14px Montserrat,Arial}.wrap{max-width:1100px;margin:auto;padding:28px}.ey{color:#32e6ff;font:700 11px Orbitron;letter-spacing:3px}h1{font:800 38px Orbitron}.card{background:#0b0b14;border:1px solid #29293a;border-radius:18px;padding:18px;margin:16px 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}.item{border:1px solid #242438;border-radius:14px;padding:15px;margin:10px 0}.muted{color:#9da0b0}.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}button,input,textarea,select{padding:10px;border-radius:9px;border:1px solid #333;background:#08080e;color:#fff}button{background:#32e6ff;color:#020207;font-weight:800;border:0}.danger{background:#5a1835;color:#fff}.back{color:#32e6ff}.pill{display:inline-block;padding:4px 8px;border-radius:99px;background:#17172a;color:#32e6ff}</style></head><body><div class="wrap"><a class="back" href="admin.html">← Admin Command Center</a><div class="ey">CROWRULES • SPECTRUM</div><h1>CATEGORY MANAGEMENT</h1><p class="muted">Create, edit, reorder, and activate Spectrum award categories.</p><div id="notice">Verifying administrator access…</div><section id="app" hidden><div class="card"><h2>Add Category</h2><div class="grid"><input id="name" placeholder="Category name"><input id="type" placeholder="Category type"><input id="order" type="number" placeholder="Sort order"><textarea id="desc" placeholder="Description"></textarea></div><div class="row"><button id="add">ADD CATEGORY</button></div></div><div class="card"><h2>Categories</h2><div id="list">Loading…</div></div></section></div><script>let db;const esc=s=>String(s??"").replace(/[&<>"]/g,x=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[x]));async function init(){const m=await CrowRulesMembership.getCrowRulesMember();db=m.client;if(!m.user){notice.textContent="Sign in required.";return}const a=await db.rpc("crplus_is_admin");if(a.error||!a.data){notice.textContent="Administrator access is required.";return}app.hidden=false;notice.textContent="Administrator access verified.";load()}async function load(){const r=await db.from("spectrum_award_categories").select("*").order("sort_order").order("id");list.innerHTML=r.error?esc(r.error.message):(r.data||[]).map(x=>'<div class="item"><span class="pill">'+(x.is_active?"ACTIVE":"INACTIVE")+'</span><h3>'+esc(x.name)+'</h3><div class="muted">Type: '+esc(x.category_type||"—")+' · Order: '+x.sort_order+'</div><p>'+esc(x.description||"")+'</p><div class="row"><button onclick="toggle('+x.id+','+(!x.is_active)+')">'+(x.is_active?"DEACTIVATE":"ACTIVATE")+'</button><button onclick="editCat('+x.id+')">EDIT</button></div></div>').join("")||"No categories."}async function addCat(){if(!name.value.trim())return alert("Category name is required.");const r=await db.from("spectrum_award_categories").insert({name:name.value.trim(),category_type:type.value.trim()||"general",sort_order:Number(order.value)||999,description:desc.value.trim()||null,is_active:true});if(r.error)return alert(r.error.message);name.value=type.value=order.value=desc.value="";load()}async function toggle(id,v){const r=await db.from("spectrum_award_categories").update({is_active:v}).eq("id",id);if(r.error)alert(r.error.message);else load()}async function editCat(id){const q=await db.from("spectrum_award_categories").select("*").eq("id",id).single();if(q.error)return alert(q.error.message);const x=q.data;const n=prompt("Category name:",x.name);if(n===null)return;const d=prompt("Description:",x.description||"");const o=prompt("Sort order:",x.sort_order);const t=prompt("Category type:",x.category_type||"general");const r=await db.from("spectrum_award_categories").update({name:n.trim(),description:d,sort_order:Number(o)||x.sort_order,category_type:t.trim()||x.category_type}).eq("id",id);if(r.error)alert(r.error.message);else load()}add.onclick=addCat;init().catch(e=>notice.textContent=e.message);</script></body></html>
